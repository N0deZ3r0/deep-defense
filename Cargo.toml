[package]
name = "deep-defense"
version = "1.1.1"
edition = "2021"
description = "A VeraCrypt-backed password manager with a second, independent encryption layer"
license = "MIT"

[[bin]]
name = "deep-defense"
path = "src/main.rs"

[dependencies]
# `zeroize` everywhere it is offered: none of these wipe their key schedules
# or internal state by default. AES's first round key *is* the key, and the
# HMAC state inside HKDF holds a hash of the master key, so without it every
# save left usable key material behind in freed memory.
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
arboard = "3.6.1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "links"] }
egui = "0.36.2"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.9.0"

# Only for pictures of the screens, drawn in CI (`--features ui-snapshots`).
# Never part of the program: it brings a whole GPU renderer, which the tests
# run on a software adapter so they need no graphics card.
egui_kittest = { version = "0.36.2", optional = true, default-features = false, features = ["wgpu", "snapshot"] }

[features]
ui-snapshots = ["dep:egui_kittest"]

# The tests run the real key derivation and the real ciphers on every open,
# and since each open also reads its backups, most of a debug test run was
# spent in unoptimised Argon2 and AES. Dependencies are built optimised even
# in a debug build. This crate is not: the arithmetic overflow checks the tests
# are run in debug for stay on in the code they are there to check.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set. Aborting skips Drop, and Drop is
# exactly what zeroizes the master key and the decrypted entries - a panic
# would leave them sitting in memory for whatever reads the process next.
panic = "unwind"
