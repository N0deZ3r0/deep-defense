name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing in this workflow publishes anything, and a token that
# cannot write is one fewer thing to reason about if a dependency turns hostile.
permissions:
  contents: read

# A second push supersedes the first: there is no value in finishing a run for
# a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Only first-party actions are used here. A password manager's build
      # pipeline is a place worth keeping the list of things that can run
      # arbitrary code as short as it can be, and a caching action would save a
      # few minutes in exchange for another supply chain to trust.
      - uses: actions/checkout@v5

      - name: Find the GNU toolchain
        shell: pwsh
        run: |
          # gcc links, and build.rs calls windres and ar to embed the icon, so
          # the MSVC tools a Windows runner defaults to are not enough. The
          # list of places to look is shared with build.ps1 rather than
          # written out twice.
          $mingw = & .\tools\find-mingw.ps1 2>$null
          if (-not $mingw) {
            Write-Host 'Not on the image; installing MinGW.'
            choco install mingw -y --no-progress | Out-Null
            $mingw = & .\tools\find-mingw.ps1
          }
          Write-Host "Using $mingw"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Record what built this
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          gcc --version | Select-Object -First 1
          windres --version | Select-Object -First 1

      - name: Lint
        # Warnings are errors here on purpose. A lint that only prints is read
        # once and then scrolled past for the rest of the project's life.
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Test
        # Debug, not release: the release profile drops the arithmetic overflow
        # checks, and one of these tests exists because a length field
        # overflowed rather than saturating. Running them fast would be running
        # a weaker version of them.
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - name: Fingerprint
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target\x86_64-pc-windows-gnu\release\deep-defense.exe).Hash.ToLower()
          $size = [math]::Round((Get-Item target\x86_64-pc-windows-gnu\release\deep-defense.exe).Length / 1MB, 1)
          Write-Output "deep-defense.exe  $size MB"
          Write-Output "sha256  $hash"
          # Rust builds are not reproducible byte for byte, so this will differ
          # from run to run. It is here to be compared against the binary a
          # release publishes, not against a previous CI run.
          "### Built\n\n``$hash``\n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: deep-defense-windows-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-gnu/release/deep-defense.exe
          # Long enough to fetch a build from a pull request while reviewing it,
          # short enough not to leave unsigned binaries lying around for months.
          retention-days: 14
          if-no-files-found: error

  screens:
    name: Draw the screens
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Find the GNU toolchain
        shell: pwsh
        run: |
          # The same lookup as the job above: build.rs embeds the icon with
          # windres and ar, and the tests link the library that carries it.
          $mingw = & .\tools\find-mingw.ps1 2>$null
          if (-not $mingw) {
            Write-Host 'Not on the image; installing MinGW.'
            choco install mingw -y --no-progress | Out-Null
            $mingw = & .\tools\find-mingw.ps1
          }
          Write-Host "Using $mingw"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Lint the drawing code
        # It only compiles with the feature on, so the job above never sees it.
        run: cargo clippy --lib --all-targets --features ui-snapshots -- -D warnings

      - name: Draw
        # The real screens, drawn by egui's own test harness through wgpu on
        # WARP — the software Direct3D 12 adapter every Windows runner has — so
        # no graphics card is involved. Each test also asserts on what is on
        # screen through the accessibility tree, so this fails on its own; the
        # pictures are for a person to look at.
        shell: bash
        env:
          DEEP_DEFENSE_SNAPSHOTS: ${{ github.workspace }}\ui-snapshots
        run: |
          set +e
          cargo test --lib --features ui-snapshots ui::snapshots -- --test-threads=1 2>&1 | tee draw.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # A job log is only shown to someone signed in to GitHub; the
            # annotations and the summary are shown to anyone. Copy the reason
            # there, so a red job explains itself to whoever is looking.
            grep -E -A6 'panicked at|^error(\[|:)|^failures:$' draw.log | head -80 > why.txt
            {
              echo '### Why drawing failed'
              echo
              echo '```'
              cat why.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E -A3 'panicked at' draw.log | head -40 | awk '
              /panicked at/ { if (msg != "") print msg; msg = $0; next }
              /^--$/ { next }
              { msg = msg "%0A" $0 }
              END { if (msg != "") print msg }
            ' | head -8 | while IFS= read -r line; do
              echo "::error title=A screen test failed::$line"
            done
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        # Kept when a test fails too: the picture is often the quickest way to
        # see why.
        if: always()
        with:
          name: screens-${{ github.sha }}
          path: ui-snapshots/*.png
          retention-days: 14
          if-no-files-found: warn
