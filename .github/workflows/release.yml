name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach the binary to
        required: true

# Write, because this uploads to a release. Nothing else in the repository
# needs it, which is why it is granted here and not in CI.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and attach
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Find the GNU toolchain
        shell: pwsh
        run: |
          # gcc links, and build.rs calls windres and ar to embed the icon, so
          # the MSVC tools a Windows runner defaults to are not enough. The
          # list of places to look is shared with build.ps1 rather than
          # written out twice.
          $mingw = & .\tools\find-mingw.ps1 2>$null
          if (-not $mingw) {
            Write-Host 'Not on the image; installing MinGW.'
            choco install mingw -y --no-progress | Out-Null
            $mingw = & .\tools\find-mingw.ps1
          }
          Write-Host "Using $mingw"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test before publishing anything
        # A release is the one build people run without reading it first, so it
        # is the last place to skip the tests to save four minutes.
        run: cargo test --lib

      - name: Build and fingerprint
        shell: pwsh
        # The same script used to build by hand, so the released binary and a
        # local one are made the same way and the fingerprint is computed in
        # one place rather than two that can drift apart.
        run: .\build.ps1

      - name: Show what will be attached
        shell: pwsh
        run: Get-Content SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $exe = 'target/x86_64-pc-windows-gnu/release/deep-defense.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $commit = (git rev-parse --short HEAD).Trim()

          # The notes are written in the repository, beside the code they
          # describe, and only the two facts that exist after the build — the
          # fingerprint and the commit — are filled in here. A fingerprint
          # typed in by hand would be the one line of the notes nobody checks.
          $source = "docs/releases/$tag.md"
          if (Test-Path $source) {
            $notes = (Get-Content $source -Raw -Encoding utf8).Replace('{{SHA256}}', $hash).Replace('{{COMMIT}}', $commit)
          } else {
            $notes = "Built from $commit.`n`nSHA-256 of deep-defense.exe: ``$hash``"
          }
          Set-Content release-notes.md $notes -Encoding utf8

          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            # Already there, made by hand or by an earlier run of this job.
            # --clobber so a re-run replaces the assets rather than failing
            # half way and leaving a release with one of the two.
            gh release upload $tag $exe SHA256SUMS.txt --clobber --repo ${{ github.repository }}
            gh release edit $tag --notes-file release-notes.md --repo ${{ github.repository }}
          } else {
            $version = $tag.TrimStart('v')
            gh release create $tag $exe SHA256SUMS.txt `
              --title "Deep Defense $version" `
              --notes-file release-notes.md `
              --verify-tag `
              --repo ${{ github.repository }}
          }
